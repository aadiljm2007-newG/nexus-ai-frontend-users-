<script id="mesh-script">
    const canvas = document.getElementById('canvas-mesh');
    if (canvas) {
        const ctx = canvas.getContext('2d');
        let width, height;
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        resize();

        const gridSize = 45;
        
        const mouseForce = 150;

        function applyPhysics(x, y) {
            let px = x;
            let py = y;
            
            const dxM = px - mouse.x;
            const dyM = py - mouse.y;
            const distM = Math.sqrt(dxM * dxM + dyM * dyM);
            if (distM < mouseForce) {
                const power = Math.pow((mouseForce - distM) / mouseForce, 1.5);
                px -= (dxM / distM) * 30 * power;
                py -= (dyM / distM) * 30 * power;
            }
            return { x: px, y: py };
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            
            

            for (let x = 0; x <= width; x += gridSize) {
                ctx.beginPath();
                for (let y = 0; y <= height; y += 10) {
                    const pos = applyPhysics(x, y);
                    if (y === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }

            for (let y = 0; y <= height; y += gridSize) {
                ctx.beginPath();
                for (let x = 0; x <= width; x += 10) {
                    const pos = applyPhysics(x, y);
                    if (x === 0) ctx.moveTo(pos.x, pos.y);
                    else ctx.lineTo(pos.x, pos.y);
                }
                ctx.stroke();
            }
            requestAnimationFrame(draw);
        }
        draw();
    }
